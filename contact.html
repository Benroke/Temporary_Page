<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>





    <!-- Navigation Section -->
    <nav class="navbar">
        <a href="#home" class="brand">
            <span class="brand-icon" aria-hidden="true">Logo</span>
            <span class="brand-text">
                <strong>Company Name</strong>
                <small>Cheese is the best, if you think otherwise, just die</small>
            </span>
        </a>

        <div class="nav-links">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="about.html">About</a>
            <a class="contact-btn" href="contact.html">Contact Us</a>
        </div>
    </nav>





    <!-- Form Section -->
    <section class="form-section" aria-labelledby="form-heading">
        <div class="form-container">
            <h2 class="form-heading" id="form-heading">Get in Touch</h2>
            <p class="form-description">
                Have questions or want to learn more about our services? Fill out the form below and we'll get back to you as soon as possible.
            </p>

            <form class="contact-form" action="#" method="post">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </section>





</body>
</html>
